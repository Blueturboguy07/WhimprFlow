[package]
name = "whimpr-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "whimpr_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
whimpr-core = { path = "../crates/whimpr-core" }
whimpr-ipc = { path = "../crates/whimpr-ipc" }
whimpr-audio = { path = "../crates/whimpr-audio" }
whimpr-asr = { path = "../crates/whimpr-asr" }
whimpr-cleanup = { path = "../crates/whimpr-cleanup" }
# The platform credential stores are opt-in features in keyring 3. Without them
# the crate silently selects its in-memory mock (`keyring/src/lib.rs`:
# `#[cfg(all(target_os = "macos", not(feature = "apple-native")))] pub use mock
# as default;`), so every key "saved to keychain" vanished at relaunch and the
# app minted/asked again each launch. These two select the macOS Keychain and
# the Windows Credential Manager the README has always promised.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
strsim = "0.11"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
arboard = "3"
tauri-plugin-global-shortcut = "2"
# The in-app speech model download (asr_model.rs): same reqwest build the
# cleanup crate already compiles, and SHA-256 to check the file before use.
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
sha2 = "0.10"

# Only Windows/Linux need this: relaunching the exe otherwise spawns a second,
# independent process (duplicate taskbar entry). macOS's Dock re-activates the
# existing app instead, so the plugin isn't needed (and isn't supported) there.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "windows")'.dependencies]
# Windows platform layer (low-level keyboard hook, SendInput paste, foreground-app
# detection). UNVERIFIED: written on macOS, never compiled or run on Windows.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
] }

[target.'cfg(target_os = "macos")'.dependencies]
macos-accessibility-client = "0.0.1"
# Frontmost-app detection (paste-target → per-app cleanup formatting). Already in
# the tree via Tauri; declared here so we can call NSWorkspace directly.
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat"] }
# Obj-C block support + the objc2 runtime `Bool`, for the AVCaptureDevice
# mic-permission completion handler in paste.rs. Versions match what the objc2
# framework crates already resolve to.
block2 = "0.6"
objc2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# Global keyboard listener (X11 + Wayland). Needs /dev/input access — add user to
# the 'input' group if events aren't received.
rdev = "0.5"
# Keyboard simulation is done via ydotool (Wayland) or xdotool (X11) as subprocess
# calls, avoiding libxdo/libei C dependency issues.
