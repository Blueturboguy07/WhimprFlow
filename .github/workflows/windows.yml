# TRIAGE PROBE BRANCH (lane whimprflow-windows-silent): same build as v0.2.2,
# but the unit tests and the real model download are skipped (already proven
# by the v0.2.2 release run 35983789434), and scripts/probe-windows-dictate.ps1
# runs instead of verify-windows.ps1. See that script's header.

name: windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: libclang 18 for bindgen
        shell: pwsh
        run: |
          python -m pip install --quiet libclang==18.1.1
          $dir = (python -c "import clang, os; print(os.path.dirname(clang.__file__) + r'\native')").Trim()
          "LIBCLANG_PATH=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Fetch the speech model to bundle
        shell: bash
        run: scripts/fetch-speech-model.sh

      - name: Build the installer
        shell: pwsh
        env:
          PUBLIK_APP_TOKEN: ${{ secrets.PUBLIK_APP_TOKEN }}
        run: |
          Set-Location src-tauri
          ..\ui\node_modules\.bin\tauri.CMD build --config tauri.bundled-model.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install and probe the first run
        shell: powershell
        run: .\scripts\probe-windows-dictate.ps1 -OutDir probe-windows-out

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-windows
          path: probe-windows-out
