# Windows: build the NSIS installer with the speech model bundled, run the
# Rust tests (including the real 148 MB model download), then install the
# build on the runner and prove it transcribes-ready (scripts/verify-windows.ps1):
# the bundled model loads, and with it removed the Hub's "Download speech
# model" button fetches, verifies and loads one with no relaunch.
#
# With the TAURI_SIGNING_PRIVATE_KEY secret, the build also writes the installer's
# updater signature (<installer>.sig, tauri.updater.conf.json; docs/updates.md) and
# checks it. On a published release, the installer and its .sig are attached to that
# release, and latest.json is written when the Mac update bundle is there too.

name: windows

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the installer to this existing release tag (optional)"
        required: false

permissions:
  contents: write

# publik telemetry is off on build machines: a test run is not a user.
env:
  DO_NOT_TRACK: "1"
  # No automatic update check while the checks drive the app (src-tauri/src/updates.rs).
  PUBLIK_NO_AUTO_UPDATE: "1"

jobs:
  # A release that already holds a Windows installer keeps it. Such a release
  # was built, checked and filled before it was published (the publik telemetry
  # builds are made this way: .github/workflows/publik-build.yml). To replace an
  # installer on purpose, delete it from the release first.
  guard:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # The list, not releases/tags/<tag>: the list also shows a draft.
          NAMES="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .assets[].name')"
          if printf '%s\n' "$NAMES" | grep -- '-setup\.exe$' >/dev/null; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $TAG already holds a Windows installer. Nothing is built and nothing is replaced."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: guard
    if: needs.guard.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # whisper-rs-sys runs bindgen, which needs libclang 18; the runner's LLVM
      # is newer. Same side-load the publik install guide uses.
      - name: libclang 18 for bindgen
        shell: pwsh
        run: |
          python -m pip install --quiet libclang==18.1.1
          $dir = (python -c "import clang, os; print(os.path.dirname(clang.__file__) + r'\native')").Trim()
          "LIBCLANG_PATH=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Rust tests
        run: cargo test --release -p whimpr-core -p whimpr-tauri

      - name: Real speech model download (network)
        run: cargo test --release -p whimpr-tauri real_download -- --ignored --nocapture

      - name: Fetch the speech model to bundle
        shell: bash
        run: scripts/fetch-speech-model.sh

      # With the update key, tauri build also signs the installer for the updater
      # (tauri.updater.conf.json). A release needs that signature; a pull request from a
      # fork has no secrets and builds without it.
      - name: Build the installer
        shell: pwsh
        env:
          PUBLIK_APP_TOKEN: ${{ secrets.PUBLIK_APP_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          $updater = @()
          if ($env:TAURI_SIGNING_PRIVATE_KEY) { $updater = @("--config", "tauri.updater.conf.json") }
          elseif ($env:RELEASE_TAG) { Write-Host "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set. A release installer needs its updater signature."; exit 1 }
          else { Write-Host "::warning::No update key: this installer has no updater signature." }
          Set-Location src-tauri
          ..\ui\node_modules\.bin\tauri.CMD build --config tauri.bundled-model.conf.json @updater
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The signature must verify against the pubkey in tauri.conf.json and name this version.
      - name: Check the updater signature
        shell: bash
        env:
          HAS_UPDATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_UPDATE_KEY" != true ]; then echo "No update key: no signature to check."; exit 0; fi
          EXE="$(ls target/release/bundle/nsis/*-setup.exe)"
          [ -s "$EXE.sig" ] || { echo "::error::no updater signature next to $EXE"; exit 1; }
          VERSION="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          node scripts/updater-latest-json.mjs --version "$VERSION" \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/" \
            --platform "windows-x86_64=$EXE" --out "$RUNNER_TEMP/latest-check.json"

      # DO_NOT_TRACK: the app sends publik usage counts, and a CI runner is not a user.
      - name: Install and verify
        shell: powershell
        env:
          DO_NOT_TRACK: "1"
        run: .\scripts\verify-windows.ps1 -OutDir verify-windows-out

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-windows
          path: verify-windows-out

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: whimprflow-windows-installer
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig

      - name: Attach the installer to the release
        if: github.event_name == 'release' || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        # No --clobber: an installer that is already on the release is never replaced.
        run: gh release upload "$TAG" target/release/bundle/nsis/*-setup.exe target/release/bundle/nsis/*-setup.exe.sig

      # latest.json, when the Mac update bundle is on the release too (docs/updates.md).
      - name: Write the update feed
        if: github.event_name == 'release' || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: scripts/updater-release-feed.sh "$TAG" --if-complete
