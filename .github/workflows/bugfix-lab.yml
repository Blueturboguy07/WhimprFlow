name: bugfix-lab

on:
  workflow_dispatch:
  # The REST Actions API is under a secondary rate limit for this account right
  # now, so `gh workflow run` 403s. A push over the git protocol is not rate
  # limited, so the oracle can still start a controlled run.
  push:
    branches:
      - fix/whimprflow-windows-build-toolchain

jobs:
  windows-build-toolchain:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Run oracle script
        shell: powershell
        run: .\scripts\bugfix-lab\whimprflow-windows-build-toolchain.ps1

  # LLVM angle: the runner image ships LLVM pre-installed, which no consumer
  # Windows machine does. These jobs remove it and then perform the guide's
  # reader step 7 the way a real reader does.
  windows-build-toolchain-llvm:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [step7-default, no-llvm, step7-path]
    steps:
      - uses: actions/checkout@v4

      - name: Run oracle script (LLVM angle)
        shell: powershell
        env:
          BUGFIX_VARIANT: ${{ matrix.variant }}
        run: .\scripts\bugfix-lab\whimprflow-windows-build-toolchain-llvm.ps1
