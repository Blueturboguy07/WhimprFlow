# Linux: prove the app still builds and its tests pass on Ubuntu. Runs the
# Rust tests, builds the on-device cleanup worker, then bundles the .deb and
# AppImage and uploads them as workflow artifacts.
#
# Uses no secrets and only read permission, so it runs the same on pull
# requests from forks (where secrets are not available).

name: linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang libclang-dev pkg-config file patchelf \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libasound2-dev libx11-dev libxi-dev libxtst-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Rust tests
        run: cargo test --release -p whimpr-core -p whimpr-ipc -p whimpr-tauri

      - name: Build the cleanup worker
        run: cargo build --release -p whimpr-llm-worker

      - name: Build the .deb and AppImage
        working-directory: src-tauri
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ../ui/node_modules/.bin/tauri build --bundles deb,appimage

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: whimprflow-linux-deb
          path: target/release/bundle/deb/*.deb

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: whimprflow-linux-appimage
          path: target/release/bundle/appimage/*.AppImage
